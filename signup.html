<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
<div class="div" data-aos="fade-right" data-aos-duration="800" data-aos-easing="linear">
    <p>Welcome <span class="heart">&#10084;</span></p>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>
<form action="signup.php" method="POST" data-aos="fade-left" data-aos-duration="800" data-aos-easing="ease-in-sine">
    <fieldset>
        <legend>Create An Account</legend>
        <div class="input-box">
            <input type="text" name="username" required>
            <label>Username</label>
        </div>

        <div class="input-box">
            <input type="email" name="email" required>
            <label>Email</label>
        </div>

        <div class="input-box">
            <input type="password" name="password" required>
            <label>Password</label>
        </div>

        <button type="submit">Create Account</button>
    </fieldset>
</form>

</body>
</html>
